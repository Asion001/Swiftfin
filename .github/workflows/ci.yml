name: "Build 🔨"

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches: [ main ]

# Only the newest commit on a ref is worth building. Scoped by ref, so a push
# to main never cancels a pull request's build or the other way round.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build 🔨"
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        include:
          - scheme: "Swiftfin"
            destination: "generic/platform=iOS"
          - scheme: "Swiftfin tvOS"
            destination: "generic/platform=tvOS"

    runs-on: macos-26

    env:
      XCODE_VERSION: "26.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Homebrew dependencies
        run: brew bundle --file Brewfile

      - name: Install pinned SwiftFormat
        run: bash Scripts/install_ci_swiftformat.sh

      - name: Restore Swift packages
        id: swift-packages
        uses: actions/cache/restore@v6
        with:
          path: |
            build/SourcePackages/checkouts
            build/SourcePackages/repositories
            build/SourcePackages/artifacts
            build/SourcePackages/workspace-state.json
          key: spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_VERSION }}-${{ matrix.scheme }}-${{ hashFiles('Swiftfin.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_VERSION }}-${{ matrix.scheme }}-

      - name: Build
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 60
          command: xcodebuild -quiet -skipMacroValidation -skipPackagePluginValidation -project Swiftfin.xcodeproj -scheme "${{ matrix.scheme }}" -destination "${{ matrix.destination }}" -clonedSourcePackagesDirPath build/SourcePackages CODE_SIGNING_ALLOWED=NO build

      # Populate the shared cache from main,
      # PR caches are isolated to their merge ref
      - name: Save Swift packages
        if: ${{ github.event_name == 'push' && steps.swift-packages.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            build/SourcePackages/checkouts
            build/SourcePackages/repositories
            build/SourcePackages/artifacts
            build/SourcePackages/workspace-state.json
          key: ${{ steps.swift-packages.outputs.cache-primary-key }}

name: Sync Jellyfin Upstream

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge conflict-free upstream changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/jellyfin/Swiftfin.git
          git fetch upstream main

      - name: Merge and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains the latest upstream main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          set +e
          git merge --no-edit upstream/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            git merge --abort
            {
              echo "## Upstream sync needs attention"
              echo
              echo "The automatic merge stopped without changing main. Conflicting files:"
              echo '```'
              echo "$conflicts"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::Upstream merge failed; resolve the conflicts listed in the job summary."

            if [ "$(gh api "repos/${{ github.repository }}" --jq .has_issues || echo false)" = "true" ]; then
              issue_number=$(gh issue list --state open --search 'Upstream sync conflict in:title' --json number --jq '.[0].number // empty' || true)
              body_file=$(mktemp)
              {
                echo "Automatic sync with jellyfin/Swiftfin main found conflicts and left the fork unchanged."
                echo
                echo '```'
                echo "$conflicts"
                echo '```'
                echo
                echo "See workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              } > "$body_file"
              if [ -n "$issue_number" ]; then
                gh issue comment "$issue_number" --body-file "$body_file" || echo "::warning::Could not update the conflict issue; see the job summary."
              else
                gh issue create --title "Upstream sync conflict" --body-file "$body_file" || echo "::warning::Could not create the conflict issue; see the job summary."
              fi
              rm -f "$body_file"
            fi
            exit 1
          fi

          git push origin HEAD:main

          if [ "$(gh api "repos/${{ github.repository }}" --jq .has_issues || echo false)" = "true" ]; then
            issue_number=$(gh issue list --state open --search 'Upstream sync conflict in:title' --json number --jq '.[0].number // empty' || true)
            if [ -n "$issue_number" ]; then
              gh issue close "$issue_number" --comment "Automatic upstream synchronization is working again." || echo "::warning::Sync succeeded, but the conflict issue could not be closed."
            fi
          fi

name: Publish AltStore Release

on:
  push:
    branches: [main]
    paths-ignore:
      - altstore-source.json
      - .github/workflows/enhancement-ci.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: altstore-release-main
  cancel-in-progress: true

env:
  BUNDLE_IDENTIFIER: dev.asion.swiftfin.enhanced
  IPA_NAME: Swiftfin-Enhanced.ipa
  MAC_BUNDLE_IDENTIFIER: dev.asion.swiftfin.enhanced.macos
  MAC_ZIP_NAME: Swiftfin-Enhanced-Mac.zip
  MAC_SHA_NAME: Swiftfin-Enhanced-Mac.zip.sha256

jobs:
  publish:
    name: Test, build, and publish
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: brew bundle --file Brewfile

      - name: Cache Carthage
        uses: actions/cache@v4
        id: carthage-cache
        with:
          path: Carthage
          key: ${{ runner.os }}-carthage-${{ hashFiles('Cartfile.resolved') }}
          restore-keys: ${{ runner.os }}-carthage-

      - name: Build Carthage dependencies
        if: steps.carthage-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v2
        with:
          max_attempts: 4
          retry_wait_seconds: 10
          timeout_minutes: 20
          command: carthage update --use-xcframeworks --cache-builds

      - name: Test AltStore source generator
        run: python3 -m unittest Scripts/test_update_altstore_source.py

      - name: Test enhanced player
        run: |
          xcodebuild -quiet \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:SwiftfinTests \
            test

      - name: Create release metadata
        id: metadata
        run: |
          year=$(date -u +%Y)
          month=$(date -u +%m)
          day=$(date -u +%d)
          version="$year.$((10#$month)).$((10#$day))"
          build_version=$(date -u +%s)
          tag="enhanced-$version-$build_version"
          release_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          short_sha=$(git rev-parse --short=7 HEAD)
          {
            echo "version=$version"
            echo "build_version=$build_version"
            echo "tag=$tag"
            echo "release_date=$release_date"
            echo "short_sha=$short_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Build unsigned device app
        run: |
          xcodebuild -quiet \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SwiftfinDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS= \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            MARKETING_VERSION="${{ steps.metadata.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.metadata.outputs.build_version }}" \
            build

      - name: Package and verify IPA
        id: package
        run: |
          app="$RUNNER_TEMP/SwiftfinDerivedData/Build/Products/Release-iphoneos/Swiftfin iOS.app"
          payload="$RUNNER_TEMP/AltStorePayload/Payload"
          ipa="$RUNNER_TEMP/$IPA_NAME"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = "$BUNDLE_IDENTIFIER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = "${{ steps.metadata.outputs.version }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "${{ steps.metadata.outputs.build_version }}"
          mkdir -p "$payload"
          ditto --norsrc --noextattr "$app" "$payload/Swiftfin iOS.app"
          ditto -c -k --norsrc --noextattr --keepParent "$RUNNER_TEMP/AltStorePayload/Payload" "$ipa"
          test -s "$ipa"
          unzip -tq "$ipa"
          if unzip -l "$ipa" | grep -q '__MACOSX'; then
            echo "IPA contains forbidden Finder metadata"
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "ipa=$ipa" >> "$GITHUB_OUTPUT"

      - name: Build unsigned Apple silicon Mac app
        run: |
          xcodebuild -quiet \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$RUNNER_TEMP/SwiftfinMacDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS= \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$MAC_BUNDLE_IDENTIFIER" \
            INFOPLIST_KEY_CFBundleDisplayName='Swiftfin Enhanced' \
            MARKETING_VERSION="${{ steps.metadata.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.metadata.outputs.build_version }}" \
            build

      - name: Package and verify Mac app
        id: package_mac
        run: |
          source_app="$RUNNER_TEMP/SwiftfinMacDerivedData/Build/Products/Release-maccatalyst/Swiftfin iOS.app"
          stage="$RUNNER_TEMP/SwiftfinMacPackage"
          app="$stage/Swiftfin Enhanced.app"
          zip="$RUNNER_TEMP/$MAC_ZIP_NAME"
          sha="$RUNNER_TEMP/$MAC_SHA_NAME"
          test -d "$source_app"
          mkdir -p "$stage"
          ditto --norsrc --noextattr "$source_app" "$app"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Swiftfin Enhanced" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationCategoryType string public.app-category.entertainment" "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "$MAC_BUNDLE_IDENTIFIER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Contents/Info.plist")" = "Swiftfin Enhanced"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Contents/Info.plist")" = "MacOSX"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "${{ steps.metadata.outputs.version }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "${{ steps.metadata.outputs.build_version }}"
          test "$(lipo -archs "$app/Contents/MacOS/Swiftfin iOS")" = "arm64"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --norsrc --noextattr --keepParent "$app" "$zip"
          test -s "$zip"
          unzip -tq "$zip"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$MAC_ZIP_NAME" > "$MAC_SHA_NAME")
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          notes="Automated Swiftfin Enhanced build from commit ${{ steps.metadata.outputs.short_sha }}. Includes the MPV player built on libmpv with VideoToolbox hardware decoding and libplacebo rendering, direct play for effectively any container and codec, MetalFX and ArtCNN shader upscaling, an MPV statistics page, screenshots, editable mpv.conf, customizable text-subtitle positioning, trickplay previews with chapter fallback, zoom-to-fill cropping, left-brightness and right-volume gestures, and a playback sleep timer. Install iOS/iPadOS through the AltStore Classic source, or use the checksum-verified Apple silicon Mac package."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "${{ steps.package.outputs.ipa }}#$IPA_NAME" \
              "${{ steps.package_mac.outputs.zip }}#$MAC_ZIP_NAME" \
              "${{ steps.package_mac.outputs.sha }}#$MAC_SHA_NAME" \
              --clobber
          else
            gh release create "$TAG" \
              "${{ steps.package.outputs.ipa }}#$IPA_NAME" \
              "${{ steps.package_mac.outputs.zip }}#$MAC_ZIP_NAME" \
              "${{ steps.package_mac.outputs.sha }}#$MAC_SHA_NAME" \
              --title "Swiftfin Enhanced ${{ steps.metadata.outputs.version }} (${{ steps.metadata.outputs.build_version }})" \
              --notes "$notes"
          fi

      - name: Update AltStore source
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          python3 Scripts/update_altstore_source.py \
            --source altstore-source.json \
            --ipa "${{ steps.package.outputs.ipa }}" \
            --info-plist "${{ steps.package.outputs.app }}/Info.plist" \
            --date "${{ steps.metadata.outputs.release_date }}" \
            --download-url "https://github.com/${{ github.repository }}/releases/download/$TAG/$IPA_NAME" \
            --description "Automated build from ${{ steps.metadata.outputs.short_sha }}. Includes the MPV player built on libmpv with VideoToolbox hardware decoding and libplacebo rendering, direct play for effectively any container and codec, MetalFX and ArtCNN shader upscaling, an MPV statistics page, screenshots, editable mpv.conf, customizable text-subtitle positioning, trickplay previews with chapter fallback, zoom-to-fill cropping, left-brightness and right-volume gestures, and a playback sleep timer. Also includes current upstream Swiftfin changes."

      - name: Commit updated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add altstore-source.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update AltStore source for ${{ steps.metadata.outputs.tag }} [skip ci]"
          git push origin HEAD:main

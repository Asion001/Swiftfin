name: Media server core

on:
  push:
    paths:
      - 'Shared/Services/MediaServers/**'
      - 'Tests/MediaServerCoreTests/**'
      - 'Package.swift'
      - '.github/workflows/media-server-core.yml'
  pull_request:
    paths:
      - 'Shared/Services/MediaServers/**'
      - 'Tests/MediaServerCoreTests/**'
      - 'Package.swift'
      - '.github/workflows/media-server-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-server-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test the provider-independent core
        run: swift test
      - name: Compile for iOS and tvOS
        run: |
          xcrun swiftc -typecheck -swift-version 6 -target arm64-apple-ios16.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" Shared/Services/MediaServers/*.swift
          xcrun swiftc -typecheck -swift-version 6 -target arm64-apple-tvos16.0 \
            -sdk "$(xcrun --sdk appletvos --show-sdk-path)" Shared/Services/MediaServers/*.swift

name: MPV Player CI

# Pull requests only. On a push to main the release workflow builds and tests
# the same commit for real, so running this there duplicated ~20 minutes of
# macOS work against a five-job concurrency limit and delayed the release it
# was racing.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: MPV integration tests
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew bundle --file Brewfile

      - name: Install pinned SwiftFormat
        run: bash Scripts/install_ci_swiftformat.sh

      # validate-pr.yaml only runs these on pull_request, but this fork commits
      # straight to main, so on the normal workflow they never ran at all.
      - name: Lint
        run: |
          swiftformat . --lint --config .swiftformat
          swiftlint lint --strict --config .swiftlint.yml
          swift Scripts/Translations/FindUnusedStrings.swift

      - name: Test AltStore source generator
        run: python3 -m unittest Scripts/test_update_altstore_source.py

      - name: Test MPV player
        run: |
          xcodebuild -quiet \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:SwiftfinTests \
            test

      # MPVKit's Catalyst slices ship as shallow bundles, which Xcode refuses
      # to embed; repair them the same way the release workflow does.
      - name: Resolve Swift packages for Mac Catalyst
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -derivedDataPath "$RUNNER_TEMP/SwiftfinMacDerivedData"

      - name: Repair Mac Catalyst framework layout
        run: |
          bash Scripts/fix_catalyst_framework_layout.sh \
            "$RUNNER_TEMP/SwiftfinMacDerivedData/SourcePackages/artifacts"

      - name: Build Mac Catalyst compatibility
        run: |
          xcodebuild -quiet \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/SwiftfinMacDerivedData" \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS= \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      # tvOS is not built here: ci.yml already builds that scheme on every pull
      # request, and this fork's changes to it are compiled out anyway.

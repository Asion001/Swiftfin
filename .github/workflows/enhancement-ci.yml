name: MPV Player CI

# Pull requests only. On a push to main the release workflow builds and tests
# the same commit for real, so running this there duplicated ~20 minutes of
# macOS work against a five-job concurrency limit and delayed the release it
# was racing.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: MPV integration tests
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew bundle --file Brewfile

      - name: Cache Carthage
        uses: actions/cache@v4
        id: carthage-cache
        with:
          path: Carthage
          key: ${{ runner.os }}-carthage-${{ hashFiles('Cartfile.resolved') }}
          restore-keys: ${{ runner.os }}-carthage-

      - name: Build Carthage dependencies
        if: steps.carthage-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v2
        with:
          max_attempts: 4
          retry_wait_seconds: 10
          timeout_minutes: 20
          command: carthage update --use-xcframeworks --cache-builds

      - name: Test AltStore source generator
        run: python3 -m unittest Scripts/test_update_altstore_source.py

      - name: Test MPV player
        run: |
          xcodebuild -quiet \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:SwiftfinTests \
            test

      - name: Build Mac Catalyst compatibility
        run: |
          xcodebuild -quiet \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -configuration Debug \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS= \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      # tvOS is not built here: ci.yml already builds that scheme on every pull
      # request, and this fork's changes to it are compiled out anyway.
